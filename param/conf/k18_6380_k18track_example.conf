# Generator 6380: 1.4 GeV/c K+ beam-through using K18Tracking directly.
# Replace the profile path below with one calibrated K18Tracking ROOT file.
# x/y/u/v and the momentum (p_3rd) are sampled together from the same track,
# so the measured position-angle-momentum correlation is kept.

Experiment: 63
DCGEO: param/DCGEO/DCGeomParam_e63_20260613
DSIZE: param/DSIZE/DetSize_E63_260529
HIST: param/HIST/HistParam_E63_260529
FLDMAP: fieldmap/E70_2023May/StsFieldMap_20230731_BH14full.dat

# Beam-through field setting: q * PK18 / 1.4 for the S-2S QQD magnets.
Q1SCALE: 1.0
Q2SCALE: 1.0
D1SCALE: 1.0
PK18: 1.4

EM: 1
DECAY: 0
HADRON: 0

Generator: 6380
TargetMaterial: Air
UseK18Beamline: 1
DisableBAC: 1
HBXXGe: 0
GeNaIEffOnly: 1

# Positive-beam K1.8 field polarity at 1.4 GeV/c.
K18GlobalScale: -1.0
K18Q10Scale: 1.0
K18Q11Scale: 1.0
K18D4Scale: 1.013987105
K18Q12Scale: 1.0
K18Q13Scale: 1.0

K18PhaseSpaceParticle: kaon+
K18PhaseSpaceP: 1.4
K18PhaseSpaceDPOverP: 0.03
K18PhaseSpaceProfile: /path/to/run74894_K18Tracking.root
K18PhaseSpaceProfileTree: k18track
K18PhaseSpaceProfileP: 1.4
K18PhaseSpaceProfileTargetZ: 1503.0
K18PhaseSpaceProfileChiSqMax: 5.0
K18PhaseSpaceProfileMaxTracks: 200000
# Use p_3rd of the selected track as the beam momentum.  K18PhaseSpaceDPOverP
# is then ignored; K18PhaseSpaceP and K18PhaseSpaceProfileP only label the
# anchor and must agree.
K18PhaseSpaceUseProfileMomentum: 1
K18PhaseSpaceUseTargetPlane: 1
K18PhaseSpaceSourceOffset: -50.0
K18PhaseSpaceBackPropStep: 1.0
K18PhaseSpaceBackPropMaxPath: 12000.0

TREE: 1
CheckOverlap: 0
